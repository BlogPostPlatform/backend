name: Backend pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: backend-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yaml

  test:
    name: Test
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/test.yaml

  build:
    name: Build
    needs: test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-push.yaml
    with:
      push: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-image.yaml
    with:
      image: ${{ needs.build.outputs.image }}
      digest: ${{ needs.build.outputs.digest }}

  cleanup:
    name: Cleanup
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs:
      - build
      - deploy
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/cleanup.yaml
    with:
      package-name: ${{ github.event.repository.name }}
      keep-tag: ${{ needs.build.outputs.tag }}
