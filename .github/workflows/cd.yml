name: CD -> VPS

on:
  push:
    branches: [dev]

concurrency:
  group: cd-dev
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Wait for CI to complete
        uses: actions/github-script@v7
        with:
          script: |
            const maxAttempts = 20;        // ~5 minutes total
            const delayMs = 15000;         // 15s between checks
            const delay = ms => new Promise(r => setTimeout(r, ms));

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: context.sha,
                status: 'completed'
              });

              if (data.workflow_runs.length > 0) {
                const ciRun = data.workflow_runs[0];

                if (ciRun.conclusion === 'success') {
                  console.log('CI succeeded. Proceeding to deploy.');
                  return;
                }

                throw new Error(`CI finished but failed: ${ciRun.conclusion}`);
              }

              console.log(`CI not finished yet (attempt ${attempt}/${maxAttempts}). Waiting...`);
              await delay(delayMs);
            }

            throw new Error('Timed out waiting for CI to complete');

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /home/ubuntu/blog_post/backend
            git fetch origin
            git reset --hard ${{ github.sha }}
            docker compose down --remove-orphans
            docker compose build
            docker compose up -d
