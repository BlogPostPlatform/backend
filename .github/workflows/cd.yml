name: CD -> VPS

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check CI status for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: context.sha,
              status: 'completed'
            });

            if (runs.workflow_runs.length === 0) {
              core.setFailed('No CI run found for this commit');
            }

            const ciRun = runs.workflow_runs[0];

            if (ciRun.conclusion !== 'success') {
              core.setFailed(`CI not successful (status: ${ciRun.conclusion})`);
            }

            console.log('CI passed. Proceeding to deploy.');

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /home/ubuntu/blog_post/backend
            git fetch origin
            git reset --hard ${{ github.sha }}


            docker compose down --remove-orphans
            docker compose build
            docker compose up -d
