name: blog-website

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-environment: &app-environment
  DJANGO_ENV: prod
  PORT: 8000
  POSTGRES_DB: ${POSTGRES_DB:-blog}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_HOST: redis
  REDIS_PORT: 6379

x-app-service: &app-service
  image: ${BACKEND_IMAGE:-blog-website-backend:latest}
  build:
    context: .
    target: runtime
    args:
      INSTALL_DEV_DEPENDENCIES: "false"
      APP_UID: ${APP_UID:-10001}
      APP_GID: ${APP_GID:-10001}
  env_file:
    - .env
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  stop_grace_period: 30s
  logging: *default-logging
  networks:
    - backend

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blog}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --data-checksums
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 60s
    logging: *default-logging
    networks:
      - backend

  web:
    <<: *app-service
    command: [ "/app/entrypoints/django.sh" ]
    environment:
      <<: *app-environment
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          request = urllib.request.Request('http://127.0.0.1:8000/health/ready/', headers={'X-Forwarded-Proto': 'https'});
          urllib.request.urlopen(request, timeout=4)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes", "--save", "60", "1" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 10
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - backend

  celery:
    <<: *app-service
    command: [ "/app/entrypoints/worker.sh" ]
    environment:
      <<: *app-environment
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  celery-beat:
    <<: *app-service
    command: [ "/app/entrypoints/beat.sh" ]
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  media:

networks:
  backend:
    driver: bridge
