name: blog-website

services:
  web:
    build: .
    environment:
      - ROLE=web
      - PORT=8008
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    ports:
      - "8008:8008"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - ./staticfiles:/app/staticfiles
      - media_volume:/app/media
    networks: [backend]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery:
    build: .
    environment:
      - ROLE=worker
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - .:/app
    networks: [backend]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery-beat:
    build: .
    environment:
      - ROLE=beat
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - .:/app
    networks: [backend]
    extra_hosts:
      - "host.docker.internal:host-gateway"
