name: blog-website-dev

x-dev-environment: &dev-environment
  DJANGO_ENV: dev
  PORT: 8000
  POSTGRES_DB: ${POSTGRES_DB:-blog}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_HOST: redis
  REDIS_PORT: 6379

x-dev-service: &dev-service
  image: ${DEV_BACKEND_IMAGE:-blog-website-backend:dev}
  build:
    context: .
    target: runtime
    args:
      INSTALL_DEV_DEPENDENCIES: "true"
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
  env_file:
    - .env
  volumes:
    - .:/app
  tty: true
  stdin_open: true
  networks:
    - backend

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blog}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_EXPOSED_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_EXPOSED_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  web:
    <<: *dev-service
    environment:
      <<: *dev-environment
    command: ["sh", "/app/entrypoints/django.sh"]
    ports:
      - "${WEB_PORT:-8008}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    <<: *dev-service
    environment:
      <<: *dev-environment
    command: ["sh", "/app/entrypoints/worker.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    <<: *dev-service
    environment:
      <<: *dev-environment
    command: ["sh", "/app/entrypoints/beat.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    driver: bridge
