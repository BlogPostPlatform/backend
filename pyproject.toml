[project]
name = "blog-website-backend"
version = "0.1.0"
description = "Backend API for the Blog Website project"
readme = "README.md"
requires-python = "==3.14.6"
dependencies = [
    "celery[redis]>=5.6.3",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.2.3",
    "django==6.0.7",
    "django-celery-beat==2.9.0",
    "django-cleanup>=9.0.0",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-filter>=26.1",
    "django-redis>=7.0.0",
    "django-storages[s3]>=1.14.6",
    "django-unfold>=0.102.0",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-nested-routers>=0.95.3",
    "drf-spectacular>=0.30.0",
    "google-auth>=2.56.2",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "django-silk>=5.5.0",
    "django-stubs>=6.0.7",
    "djangorestframework-stubs>=3.17.1",
    "flake8>=7.3.0",
    "gprof2dot>=2025.4.14",
    "isort>=8.0.1",
    "locust>=2.46.2",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
]

[tool.uv]
package = false
required-version = "==0.11.32"
exclude-newer = "7 days"
exclude-newer-package = {
    django-unfold = false,
    drf-nested-routers = false,
    djangorestframework-stubs = false
}
